persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log

# Слушател на стандартния порт 1883
listener 1883 0.0.0.0
# Disable anon msgs
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

user django_backend
topic readwrite #

user device_node01
topic read home/sensors/home-living/ac_control
topic write home/sensors/home-living/#